name: Build & Push Docker Images

# Триггеры: push в master и ручной запуск
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push All Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Параллельная сборка всех 5 сервисов
      matrix:
        service: [svc1, svc2, svc3, svc4, svc5]

    steps:
      # Шаг 1: Получить код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Настроить Docker Buildx для кеширования
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # Шаг 3: Войти в GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 4: Собрать и опубликовать Docker образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile находится в services/svcN/
          file: services/${{ matrix.service }}/Dockerfile
          # Пушим только при push в master, не при PR
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Имена образов: latest и SHA
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ github.sha }}
          # Кеширование через GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Шаг 5: Вывести сводку собранных образов
      - name: Build summary
        run: |
          echo "✅ Успешно собрано и опубликовано:"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ github.sha }}"
