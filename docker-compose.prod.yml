version: '3.8'

# Продакшн конфигурация для развертывания готовых образов из GHCR
# Использует готовые Docker образы вместо локальной сборки
# Для сборки образов используйте GitHub Actions workflow

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik-prod
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      # Монтируем Docker socket для автоопределения контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped

  svc1:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc1-${IMAGE_TAG:-latest}
    container_name: svc1-prod
    environment:
      - APP_VERSION=${APP_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.svc1.rule=PathPrefix(`/svc1`)"
      - "traefik.http.routers.svc1.entrypoints=web"
      - "traefik.http.services.svc1.loadbalancer.server.port=8000"
    networks:
      - web
    restart: unless-stopped

  svc2:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc2-${IMAGE_TAG:-latest}
    container_name: svc2-prod
    environment:
      - APP_VERSION=${APP_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.svc2.rule=PathPrefix(`/svc2`)"
      - "traefik.http.routers.svc2.entrypoints=web"
      - "traefik.http.services.svc2.loadbalancer.server.port=8000"
    networks:
      - web
    restart: unless-stopped

  svc3:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc3-${IMAGE_TAG:-latest}
    container_name: svc3-prod
    environment:
      - APP_VERSION=${APP_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.svc3.rule=PathPrefix(`/svc3`)"
      - "traefik.http.routers.svc3.entrypoints=web"
      - "traefik.http.services.svc3.loadbalancer.server.port=8000"
    networks:
      - web
    restart: unless-stopped

  svc4:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc4-${IMAGE_TAG:-latest}
    container_name: svc4-prod
    environment:
      - APP_VERSION=${APP_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.svc4.rule=PathPrefix(`/svc4`)"
      - "traefik.http.routers.svc4.entrypoints=web"
      - "traefik.http.services.svc4.loadbalancer.server.port=8000"
    networks:
      - web
    restart: unless-stopped

  svc5:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc5-${IMAGE_TAG:-latest}
    container_name: svc5-prod
    environment:
      - APP_VERSION=${APP_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.svc5.rule=PathPrefix(`/svc5`)"
      - "traefik.http.routers.svc5.entrypoints=web"
      - "traefik.http.services.svc5.loadbalancer.server.port=8000"
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    driver: bridge
