version: '3.8'

# Продакшн конфигурация - префикс имени проекта: ci_cd_prod
name: ci_cd_prod

# Продакшн конфигурация для развертывания готовых образов из GHCR
# Использует готовые Docker образы вместо локальной сборки
# Для сборки образов используйте GitHub Actions workflow

# Так запускаем Прод локально.
#docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

services:
  traefik:
    image: traefik:v3.1
    container_name: ci_cd_prod-traefik-1
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
    ports:
      - "8080:80"
    volumes:
      # Монтируем конфигурационные файлы Traefik
      - ./proxy/traefik.prod.yml:/etc/traefik/traefik.prod.yml
      - ./proxy/dynamic.prod.yml:/etc/traefik/dynamic.prod.yml
    networks:
      - web
    restart: unless-stopped

  svc1:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc1-${IMAGE_TAG:-latest}
    container_name: ci_cd_prod-svc1-1
    environment:
      - APP_VERSION=${APP_VERSION}

    networks:
      - web
    restart: unless-stopped

  svc2:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc2-${IMAGE_TAG:-latest}
    container_name: ci_cd_prod-svc2-1
    environment:
      - APP_VERSION=${APP_VERSION}

    networks:
      - web
    restart: unless-stopped

  svc3:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc3-${IMAGE_TAG:-latest}
    container_name: ci_cd_prod-svc3-1
    environment:
      - APP_VERSION=${APP_VERSION}

    networks:
      - web
    restart: unless-stopped

  svc4:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc4-${IMAGE_TAG:-latest}
    container_name: ci_cd_prod-svc4-1
    environment:
      - APP_VERSION=${APP_VERSION}

    networks:
      - web
    restart: unless-stopped

  svc5:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/repo}:svc5-${IMAGE_TAG:-latest}
    container_name: ci_cd_prod-svc5-1
    environment:
      - APP_VERSION=${APP_VERSION}

    networks:
      - web
    restart: unless-stopped

networks:
  web:
    driver: bridge
